name: Publish Extension

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'

      - name: Build jdoc library (provides dist/jdoc.browser.js)
        run: npm install && npm run build
        working-directory: .

      - name: Install extension dependencies
        run: npm install
        working-directory: vscode

      - name: Compile extension (esbuild)
        run: npm run vscode:prepublish
        working-directory: vscode

      - name: Publish to VS Code Marketplace
        run: npx vsce publish --no-dependencies
        working-directory: vscode
        env:
          # vsce 读取 VSCE_PAT 环境变量；兼容仓库里两种 secret 命名
          VSCE_PAT: ${{ secrets.VSCE_PAT || secrets.VSCODE_TOKEN }}

      - name: Publish to Open VSX
        run: npx ovsx publish --no-dependencies --skip-duplicate --pat "$OVSX_PAT"
        working-directory: vscode
        env:
          # ovsx 读取 OVSX_PAT 环境变量（不是 OVSX_TOKEN）；兼容仓库里两种 secret 命名
          OVSX_PAT: ${{ secrets.OVSX_TOKEN || secrets.OVSX_PAT }}
          OVSX_TOKEN: ${{ secrets.OVSX_TOKEN || secrets.OVSX_PAT }}
          # 禁止交互式提问，缺少 token 时直接失败而不是挂起
          CI: 'true'
