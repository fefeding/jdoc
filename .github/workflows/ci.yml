name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # jdoc 浏览器构建提供 dist/jdoc.browser.js（插件 esbuild 别名指向它）
      - name: Build jdoc library
        run: npm install && npm run build

      - name: Install extension dependencies
        run: npm install
        working-directory: vscode

      - name: Compile extension (esbuild)
        run: npm run vscode:prepublish
        working-directory: vscode

      # 注：DOCX/XLSX 编辑器往返回归（npm run verify:roundtrip，需 Playwright + Chromium）
      # 不在 CI 执行，浏览器回归改由本地手动跑，以换取更快的 CI 反馈。
