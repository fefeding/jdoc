<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>@fefeding/jdoc — 四格式解析与生成</title>
<style>
:root{--bd:#d0d7de;--fg:#1f2328;--mut:#57606a;--bg:#f6f8fa;--pri:#0969da}
*{box-sizing:border-box}
body{margin:0;padding:24px;font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--fg)}
h1{font-size:20px;margin:0 0 4px}
h2{font-size:15px;margin:0 0 10px}
.sub{color:var(--mut);margin-bottom:20px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start}
@media(max-width:900px){.grid{grid-template-columns:1fr}}
.card{border:1px solid var(--bd);border-radius:8px;padding:16px;background:#fff}
.card+.card{margin-top:20px}
.drop{border:2px dashed var(--bd);border-radius:8px;padding:28px;text-align:center;cursor:pointer;transition:.15s;background:var(--bg)}
.drop:hover,.drop.over{border-color:var(--pri);background:#eef4ff}
.drop b{color:var(--pri)}
label{display:inline-block;margin:4px 8px 4px 0;font-size:13px}
input[type=text],textarea{width:100%;padding:6px 8px;border:1px solid var(--bd);border-radius:6px;font:inherit;margin-bottom:8px}
textarea{min-height:110px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}
button{padding:6px 14px;border:1px solid var(--bd);border-radius:6px;background:var(--pri);color:#fff;font:inherit;cursor:pointer;margin-right:8px}
button.ghost{background:#fff;color:var(--fg)}
button:hover{opacity:.88}
#out{border:1px solid var(--bd);border-radius:6px;padding:12px;max-height:460px;overflow:auto;background:var(--bg)}
#log{white-space:pre-wrap;font-family:ui-monospace,Menlo,monospace;font-size:12px;color:var(--mut);margin-top:10px;min-height:20px}
pre{white-space:pre-wrap;word-break:break-all;font-size:12px;margin:0}
.badge{display:inline-block;padding:1px 8px;border-radius:20px;background:#ddf4ff;color:#0969da;font-size:12px;margin-right:6px}
</style>
</head>
<body>
<h1>@fefeding/jdoc</h1>
<div class="sub">PPTX / DOCX / XLSX / PDF — 一套 API 解析与生成，浏览器与 Node.js 双端可用</div>

<div class="grid">
  <div>
    <div class="card">
      <h2>解析上传的文件</h2>
      <div class="drop" id="drop">
        点击选择，或把文件拖到这里<br />
        <small>支持 .docx / .xlsx / .pptx / .pdf</small>
      </div>
      <input type="file" id="file" accept=".docx,.xlsx,.pptx,.pdf" hidden />
      <div id="log"></div>
    </div>
    <div class="card">
      <h2>预览</h2>
      <div id="out"><em style="color:#8b949e">解析结果会显示在这里</em></div>
    </div>
  </div>

  <div class="card">
    <h2>一键生成并下载</h2>
    <button id="mk-docx">DOCX</button>
    <button id="mk-xlsx">XLSX</button>
    <button id="mk-pdf">PDF</button>
    <button id="mk-pptx" class="ghost">PPTX</button>
    <div id="log2" style="color:var(--mut);font-size:12px;margin:10px 0 16px"></div>

    <h2>自定义生成</h2>
    <textarea id="spec">{
  "metadata": { "title": "示例文档" },
  "blocks": [
    { "type": "heading", "level": 1, "text": "自定义生成" },
    { "type": "paragraph", "runs": [
      { "text": "普通、" },
      { "text": "加粗", "bold": true },
      { "text": "、" },
      { "text": "彩色", "color": "#FF0000", "size": 14 }
    ] },
    { "type": "list", "ordered": false, "items": ["要点一", "要点二"] },
    { "type": "table", "header": true, "rows": [["模块","进度"],["A","100%"]] }
  ]
}</textarea>
    <button id="mk-custom">按上面 JSON 生成 DOCX</button>
  </div>
</div>

<script type="module" src="./src/main.js"></script>
</body>
</html>
